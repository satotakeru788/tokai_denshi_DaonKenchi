version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # 195MBの依存レイヤ(numpy/scipy/onnxruntime)は .gitignore 済みのため
        # cloneに含まれない。Lambda(manylinux x86_64)向けに毎ビルドで生成する。
        # build_layer.py は --platform manylinux/--python-version 3.12 を指定して
        # ダウンロードするので、ビルド環境のPythonバージョンに依存しない。
        - python3 tools/build_layer.py
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*